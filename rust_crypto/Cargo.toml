[package]
name = "rust_crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
rand = "0.8"
miniz_oxide = "0.8"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# LANDrop 兼容（v1.2.0）：x25519 kx / ChaCha20-Poly1305-IETF / secp256k1 / BLAKE2b
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = "0.10"
secp256k1 = "0.29"
blake2 = "0.10"
# 搜索引擎 v2（v1.2.6）：拼音实时转拼 / regex: 正则 / dm:dc: 本地时区日期
pinyin = "0.10"
regex = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
