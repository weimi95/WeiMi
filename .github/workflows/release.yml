name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # 必须在安装 Android SDK 之前清理，且绝不能删 /usr/local/lib/android (SDK 所在)
      - name: Free disk space (before SDK setup)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set ANDROID_HOME for Flutter
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      
      - name: Add Android targets
        run: rustup target add aarch64-linux-android
      
      - name: Build Rust library
        run: |
          cd rust_crypto
          cargo ndk -t arm64-v8a build --release
          cd ..
      
      - name: Copy Rust library to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp rust_crypto/target/aarch64-linux-android/release/librust_crypto.so android/app/src/main/jniLibs/arm64-v8a/
      
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
      
      - name: Convert keystore to PKCS12 (avoid JDK compat issues)
        run: |
          keytool -importkeystore \
            -srckeystore android/app/upload-keystore.jks \
            -destkeystore android/app/upload-keystore.p12 \
            -deststoretype PKCS12 \
            -srcstorepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -srckeypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -srcalias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -deststorepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -destkeypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -destalias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -noprompt
      
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.p12" >> android/key.properties
      
      - name: Replace internal mirrors (not reachable from Actions)
        run: |
          # Replace Aliyun Maven mirrors
          sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' android/build.gradle.kts android/settings.gradle.kts
          sed -i 's|https://maven.aliyun.com/repository/central|https://repo1.maven.org/maven2|g' android/build.gradle.kts android/settings.gradle.kts
          sed -i 's|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2|g' android/build.gradle.kts android/settings.gradle.kts
          sed -i 's|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' android/build.gradle.kts android/settings.gradle.kts
          sed -i 's|https://maven.aliyun.com/repository/jcenter|https://jcenter.bintray.com|g' android/build.gradle.kts android/settings.gradle.kts
          # Replace Tencent Cloud Gradle mirror with official
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/gradle|https://services.gradle.org/distributions/gradle|g' android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Gradle wrapper properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Checking for any remaining internal mirrors ==="
          grep -r "aliyun\|tencent\|mirrors" android/ --include="*.gradle*" --include="*.properties" || echo "No internal mirrors found"

      - name: Verify Android SDK present
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || (echo "SDK MISSING!" && exit 1)
          ls "$ANDROID_HOME/platforms" || true
          df -h /

      - name: Sync version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER=$(echo "$VERSION_NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i -E "s/^version:.*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "=== pubspec version ==="
          grep '^version:' pubspec.yaml

      - name: Build APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"
          export JAVA_OPTS="-Xmx4g"
          flutter pub get
          echo "=== Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Flutter version:"
          flutter --version
          echo "=== Building APK (arm64-v8a only, split per ABI) ==="
          flutter build apk --release --split-per-abi --target-platform android-arm64 --verbose 2>&1 | tail -200
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      
      - name: Rename and generate APK checksum
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "=== APK outputs ==="
          ls -la build/app/outputs/flutter-apk/
          SRC=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ ! -f "$SRC" ]; then SRC=build/app/outputs/flutter-apk/app-release.apk; fi
          mv "$SRC" weimi_file-${VERSION}-android-arm64.apk
          sha256sum weimi_file-${VERSION}-android-arm64.apk > weimi_file-${VERSION}-android-arm64.apk.sha256
          ls -lh weimi_file-${VERSION}-android-arm64.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            weimi_file-*-android-arm64.apk
            weimi_file-*-android-arm64.apk.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Rust library
        run: |
          cd rust_crypto
          cargo build --release
          cd ..
          copy rust_crypto\target\release\rust_crypto.dll .
      
      - name: Sync version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v',''
          $p = $v.Split('.')
          $b = [int]$p[0] * 10000 + [int]$p[1] * 100 + [int]$p[2]
          $c = Get-Content pubspec.yaml -Raw
          $c = [regex]::Replace($c, '(?m)^version:.*$', "version: $v+$b")
          [System.IO.File]::WriteAllText("$PWD\pubspec.yaml", $c)
          Write-Host "=== pubspec version ==="
          Select-String -Path pubspec.yaml -Pattern '^version:'

      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows --release
      
      - name: Create Windows ZIP
        run: |
          cd build/windows/x64/runner/Release
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/', ''
          Compress-Archive -Path * -DestinationPath "../../../../../weimi_file-$VERSION-windows.zip"
      
      - name: Generate Windows checksum
        run: |
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/', ''
          $hash = Get-FileHash -Algorithm SHA256 "weimi_file-$VERSION-windows.zip"
          "$($hash.Hash.ToLower())  weimi_file-$VERSION-windows.zip" | Out-File -Encoding ASCII "weimi_file-$VERSION-windows.zip.sha256"
      
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            weimi_file-*-windows.zip
            weimi_file-*-windows.zip.sha256

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Rust library
        run: |
          cd rust_crypto
          rustup target add aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cd ..

      - name: Sync version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER=$(echo "$VERSION_NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i -E "s/^version:.*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "=== pubspec version ==="
          grep '^version:' pubspec.yaml

      - name: Build macOS
        run: |
          flutter pub get
          flutter build macos --release

      - name: Copy Rust library
        run: |
          cp rust_crypto/target/aarch64-apple-darwin/release/librust_crypto.dylib build/macos/Build/Products/Release/weimi_file.app/Contents/Resources/
      
      - name: Create macOS DMG
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          brew install create-dmg
          create-dmg \
            --volname "微密文件" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            weimi_file-${VERSION}-macos.dmg \
            build/macos/Build/Products/Release/weimi_file.app || \
          (cd build/macos/Build/Products/Release && zip -r ../../../../../weimi_file-${VERSION}-macos.zip weimi_file.app)
      
      - name: Generate macOS checksums
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [ -f weimi_file-${VERSION}-macos.dmg ]; then
            shasum -a 256 weimi_file-${VERSION}-macos.dmg > weimi_file-${VERSION}-macos.dmg.sha256
          fi
          if [ -f weimi_file-${VERSION}-macos.zip ]; then
            shasum -a 256 weimi_file-${VERSION}-macos.zip > weimi_file-${VERSION}-macos.zip.sha256
          fi
      
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            weimi_file-*-macos.dmg
            weimi_file-*-macos.dmg.sha256
            weimi_file-*-macos.zip
            weimi_file-*-macos.zip.sha256

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      
      - name: Build Rust library
        run: |
          cd rust_crypto
          cargo build --release
          cd ..
          cp rust_crypto/target/release/librust_crypto.so .
      
      - name: Sync version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER=$(echo "$VERSION_NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i -E "s/^version:.*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "=== pubspec version ==="
          grep '^version:' pubspec.yaml

      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release
      
      - name: Create Linux tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../weimi_file-${VERSION}-linux.tar.gz *
      
      - name: Generate Linux checksum
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          sha256sum weimi_file-${VERSION}-linux.tar.gz > weimi_file-${VERSION}-linux.tar.gz.sha256
      
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: |
            weimi_file-*-linux.tar.gz
            weimi_file-*-linux.tar.gz.sha256

  release:
    needs: [build-android, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate combined checksums file
        run: |
          echo "# SHA256 Checksums" > SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          cat artifacts/android-apk/weimi_file-*-android-arm64.apk.sha256 >> SHA256SUMS.txt
          cat artifacts/windows-zip/weimi_file-*-windows.zip.sha256 >> SHA256SUMS.txt
          if [ -f artifacts/macos-dmg/weimi_file-*-macos.dmg.sha256 ]; then
            cat artifacts/macos-dmg/weimi_file-*-macos.dmg.sha256 >> SHA256SUMS.txt
          fi
          if [ -f artifacts/macos-dmg/weimi_file-*-macos.zip.sha256 ]; then
            cat artifacts/macos-dmg/weimi_file-*-macos.zip.sha256 >> SHA256SUMS.txt
          fi
          cat artifacts/linux-tarball/weimi_file-*-linux.tar.gz.sha256 >> SHA256SUMS.txt
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android-apk/weimi_file-*-android-arm64.apk
            artifacts/windows-zip/weimi_file-*-windows.zip
            artifacts/macos-dmg/weimi_file-*-macos.dmg
            artifacts/macos-dmg/weimi_file-*-macos.zip
            artifacts/linux-tarball/weimi_file-*-linux.tar.gz
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}