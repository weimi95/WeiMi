[package]
name = "weimi_daemon"
version = "1.2.21"
edition = "2021"

[[bin]]
name = "weimi_daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LANDrop 传输（v1.2.20 托盘收文件）：复用 rust_crypto/src/landrop.rs 的
# 同一套原语（#[path] 引进，不整体依赖 rust_crypto——那会拖入
# image/pinyin/regex/chrono/rayon，守护进程构建无谓暴涨）。
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = "0.10"
secp256k1 = "0.29"
blake2 = "0.10"
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true

[build-dependencies]
# v1.2.23：TaskDialogIndirect 需 comctl32 v6——exe 必须内嵌声明
# Common-Controls v6 依赖的 manifest，否则 LoadLibrary 只拿到 v5.82
# （该版本无 TaskDialog 导出，WER 崩溃修复方案的前置条件）
embed-manifest = "1"
